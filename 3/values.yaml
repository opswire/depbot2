replicaCount: 2

# Основной образ приложения
image:
  repository: ghcr.io/myorg/myapp
  tag: "2.1.0"
  pullPolicy: IfNotPresent

# Вспомогательный sidecar
sidecar:
  image:
    repository: ghcr.io/myorg/sidecar
    tag: "1.0.3"

# Образ без домена — пропускается
initContainer:
  image:
    repository: busybox
    tag: "1.35.0"

# Образ с нон-semver тегом — пропускается
monitoring:
  image:
    repository: ghcr.io/myorg/metrics
    tag: latest

service:
  port: 8080
