apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  # Образ с newTag
  - name: ghcr.io/myorg/myapp
    newTag: "2.1.0"
  # Образ с newName и newTag
  - name: old.registry.io/myorg/service
    newName: ghcr.io/myorg/service
    newTag: "1.4.0"
  # Образ с digest
  - name: gcr.io/distroless/java17
    newTag: "1.0.0"
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  # Без newTag — пропускается
  - name: ghcr.io/myorg/no-tag
