# Настройки dockerimageparser.
# Все поля опциональны — незаполненные берутся из DefaultConfig.

# Расширения файлов для Generic-парсера (без точки).
# xml добавлен для pom.xml и аналогичных Maven/Gradle файлов.
generic_extensions:
  - yaml
  - yml
  - xml
  - txt
  - env
  - json
  - properties
  - cfg
  - conf
  - ini

# Regexp с 4 именованными группами для поиска Docker-образов.
# Группы: domain, name, version, digest.
# Формат образа: domain/name:version@sha256:<64 hex>
#
# Покрывает:
#   - yaml/yml:  image: ghcr.io/org/app:1.2.3
#   - xml:       <image>ghcr.io/org/app:1.2.3</image>  (jib, docker-maven-plugin)
#   - env:       IMAGE=ghcr.io/org/app:1.2.3
#   - plain text: любое вхождение domain/name:version
generic_pattern: '(?P<domain>[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z]{2,})+(?::\d+)?)/(?P<name>[a-zA-Z0-9][a-zA-Z0-9._\-/]*):(?P<version>[a-zA-Z0-9][a-zA-Z0-9.\-_+]*)(?:@(?P<digest>sha256:[a-fA-F0-9]{64}))?'
